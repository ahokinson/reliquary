[package]
name = "reliquary"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
keyring = "4.1.5"
libc = "0.2.189"
rpassword = "7.5.4"
shlex = "2.0.1"
zeroize = "1.9.0"

# Only to write an entry through the handle an earlier read returned; keyring
# has no way to express that, and looking the entry up again costs a dialog.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
